<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screenshot Privacy Cleaner</title>
<style>
:root{--bg:#eef0ec;--card:#fff;--tx:#12181b;--mu:#5d6a70;--ac:#12181b;--hl:#ffd400;--bd:#d3d8d2}
@media(prefers-color-scheme:dark){:root{--bg:#0e1214;--card:#171d20;--tx:#eef1ee;--mu:#93a1a8;--ac:#ffd400;--bd:#2a3338}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font:800 1.5rem/1.2 Georgia,serif;margin:8px 0 4px}
.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
#drop{display:block;text-align:center;padding:40px 16px;border:2px dashed var(--tx);border-radius:12px;cursor:pointer;font-weight:600}
#drop.over{background:var(--hl);color:#12181b}
#drop small{display:block;font-weight:400;color:var(--mu);margin-top:6px}
#stage{background:repeating-conic-gradient(var(--bd) 0 25%,transparent 0 50%) 0/16px 16px;border-radius:8px;text-align:center}
canvas{max-width:100%;max-height:60vh;touch-action:none;cursor:crosshair;vertical-align:top}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
button,.seg label{font:inherit;font-weight:600;padding:10px 14px;border-radius:8px;border:1px solid var(--tx);background:var(--card);color:var(--tx);cursor:pointer}
button.main{background:var(--tx);color:var(--bg)}
button:focus-visible,input:focus-visible+span{outline:3px solid var(--hl);outline-offset:2px}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--tx);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);border-radius:99px;padding:4px 10px;font-size:.85rem;display:flex;gap:6px;align-items:center}
.chip.hit{background:var(--hl);color:#12181b;border-color:#12181b}
#st{color:var(--mu);min-height:1.5em}
</style>
</head>
<body>
<main>
<h1>Hide private details before you share</h1>
<p class="sub">Your image is processed on your device and never uploaded.</p>

<label id="drop" for="file">Choose a screenshot, drop it here, or paste it<small>PNG, JPG or WebP</small></label>
<input id="file" type="file" accept="image/*" hidden>

<section id="editor" hidden>
 <div class="card" id="stage"><canvas id="cv"></canvas></div>
 <p class="sub" style="margin:0 0 8px">Drag on the image to hide an area.</p>

 <div class="card">
  <div class="row seg" role="radiogroup" aria-label="Hide style">
   <label><input type="radio" name="m" value="pixel" checked>Pixelate</label>
   <label><input type="radio" name="m" value="blur">Blur</label>
   <label><input type="radio" name="m" value="bar">Black bar</label>
  </div>
  <div class="row"><label for="str">Strength</label><input id="str" type="range" min="1" max="10" value="8"></div>
 </div>

 <div class="card">
  <div class="row">
   <label><input type="checkbox" class="cat" value="email" checked> Emails</label>
   <label><input type="checkbox" class="cat" value="phone" checked> Phone numbers</label>
   <label><input type="checkbox" class="cat" value="card" checked> Card numbers</label>
   <label><input type="checkbox" class="cat" value="url"> Links</label>
   <label><input type="checkbox" class="cat" value="face"> Faces</label>
  </div>
  <button class="main" id="scan">Find private details</button>
  <div id="st" role="status"></div>
  <div class="chips" id="list"></div>
 </div>

 <div class="row">
  <button id="undo">Undo</button>
  <button id="clear">Clear all</button>
  <button class="main" id="dl">Download</button>
 </div>
 <label class="sub"><input type="checkbox" id="pro"> Paid plan (test switch: replace with a real account check)</label>
 <p class="sub" id="note"></p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=s=>document.querySelector(s), cv=$('#cv'), ctx=cv.getContext('2d');
let img=null, regions=[], hist=[], drag=null;
const FREE_MAX=1280, FREE_Q=.6;               // free plan: smaller, more compressed export
const RX={email:/[\w.+-]+@[\w-]+\.[\w.-]+/g, phone:/\+?\d[\d\s().-]{7,}\d/g,
  card:/\b(?:\d[ -]?){13,19}\b/g, url:/(?:https?:\/\/|www\.)\S+/gi};
const mode=()=>document.querySelector('[name=m]:checked').value;
const strength=()=>+$('#str').value;

function load(f){
  if(!f||!f.type.startsWith('image/'))return;
  const i=new Image();
  i.onload=()=>{img=i;cv.width=i.naturalWidth;cv.height=i.naturalHeight;regions=[];hist=[];
    $('#drop').hidden=true;$('#editor').hidden=false;list();draw();URL.revokeObjectURL(i.src)};
  i.src=URL.createObjectURL(f);
}
$('#file').onchange=e=>load(e.target.files[0]);
document.onpaste=e=>load([...e.clipboardData.files][0]);
const dz=$('#drop');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
dz.ondragleave=()=>dz.classList.remove('over');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');load(e.dataTransfer.files[0])};

function fx(r,s){
  const{x,y,w,h}=r;
  if(mode()==='bar'){ctx.fillStyle='#000';ctx.fillRect(x,y,w,h);return}
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  if(mode()==='blur'){ctx.filter=`blur(${strength()*s}px)`;ctx.drawImage(img,0,0)}
  else{
    const b=Math.max(2,strength()*s*1.5),t=document.createElement('canvas');
    t.width=Math.max(1,Math.ceil(w/b));t.height=Math.max(1,Math.ceil(h/b));
    t.getContext('2d').drawImage(img,x,y,w,h,0,0,t.width,t.height);
    ctx.imageSmoothingEnabled=false;ctx.drawImage(t,x,y,w,h);
  }
  ctx.restore();
}
function draw(preview=true){
  ctx.filter='none';ctx.drawImage(img,0,0);
  const s=Math.max(cv.width,cv.height)/400;
  regions.filter(r=>r.on).forEach(r=>fx(r,s));
  if(preview&&drag){ctx.strokeStyle='#ffd400';ctx.lineWidth=2*s;ctx.strokeRect(...drag)}
}
function list(){
  const el=$('#list');el.innerHTML='';
  regions.forEach((r,i)=>{
    const l=document.createElement('label');l.className='chip'+(r.label!=='Manual'?' hit':'');
    l.innerHTML=`<input type="checkbox" ${r.on?'checked':''}> ${r.label}`;
    l.firstChild.onchange=e=>{r.on=e.target.checked;draw()};
    el.append(l);
  });
}
const save=()=>hist.push(JSON.stringify(regions));
$('#undo').onclick=()=>{if(hist.length){regions=JSON.parse(hist.pop());list();draw()}};
$('#clear').onclick=()=>{save();regions=[];list();draw()};
$('#str').oninput=()=>draw();
document.querySelectorAll('[name=m]').forEach(r=>r.onchange=()=>draw());

const pt=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height]};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);drag=[...pt(e),0,0]};
cv.onpointermove=e=>{if(!drag)return;const[x,y]=pt(e);drag[2]=x-drag[0];drag[3]=y-drag[1];draw()};
cv.onpointerup=()=>{
  if(!drag)return;const[x,y,w,h]=drag;drag=null;
  if(Math.abs(w)>6&&Math.abs(h)>6){save();
    regions.push({x:w<0?x+w:x,y:h<0?y+h:y,w:Math.abs(w),h:Math.abs(h),label:'Manual',on:true})}
  list();draw();
};

// OCR works poorly on dark screenshots, so invert them first
function ocrSource(){
  const t=document.createElement('canvas');t.width=t.height=16;const tx=t.getContext('2d');
  tx.drawImage(img,0,0,16,16);const d=tx.getImageData(0,0,16,16).data;let sum=0;
  for(let i=0;i<d.length;i+=4)sum+=d[i]+d[i+1]+d[i+2];
  const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
  const x=c.getContext('2d');if(sum/768<110)x.filter='invert(1)';x.drawImage(img,0,0);return c;
}
function add(boxes,label){
  const p=4,x0=Math.min(...boxes.map(b=>b.x0))-p,y0=Math.min(...boxes.map(b=>b.y0))-p,
        x1=Math.max(...boxes.map(b=>b.x1))+p,y1=Math.max(...boxes.map(b=>b.y1))+p;
  regions.push({x:x0,y:y0,w:x1-x0,h:y1-y0,label,on:true});
}
$('#scan').onclick=async()=>{
  const st=$('#st'),on=[...document.querySelectorAll('.cat:checked')].map(c=>c.value);
  if(!on.length){st.textContent='Pick at least one type to look for.';return}
  save();regions=regions.filter(r=>r.label==='Manual');st.textContent='Scanning on your device…';
  let msg='';
  try{
    if(on.some(k=>RX[k])){
      const{data}=await Tesseract.recognize(ocrSource(),'eng');
      data.lines.forEach(L=>{
        let t='';const map=[];
        L.words.forEach(w=>{map.push([t.length,t.length+w.text.length,w.bbox]);t+=w.text+' '});
        on.filter(k=>RX[k]).forEach(k=>{
          for(const m of t.matchAll(RX[k])){
            const a=m.index,b=a+m[0].length,bx=map.filter(q=>q[0]<b&&q[1]>a).map(q=>q[2]);
            if(bx.length)add(bx,k);
          }});
      });
    }
    if(on.includes('face')){
      if('FaceDetector' in window)(await new FaceDetector().detect(img)).forEach(f=>{
        const b=f.boundingBox;regions.push({x:b.x,y:b.y,w:b.width,h:b.height,label:'face',on:true})});
      else msg=' Face detection is not available in this browser. Draw over faces by hand.';
    }
    st.textContent=`Found ${regions.filter(r=>r.label!=='Manual').length} item(s).${msg} Uncheck any you want to keep.`;
  }catch(err){
    st.textContent='Scan failed. Check your connection and try again. You can still draw areas by hand.';
  }
  list();draw();
};

$('#pro').onchange=()=>$('#note').textContent=$('#pro').checked?'':'Free plan: exports are smaller and more compressed. Paid plans export at full quality.';
$('#pro').onchange();
$('#dl').onclick=()=>{
  draw(false);
  const pro=$('#pro').checked;let c=cv,type='image/png',q;
  if(!pro){
    const k=Math.min(1,FREE_MAX/Math.max(cv.width,cv.height));
    c=document.createElement('canvas');c.width=Math.round(cv.width*k);c.height=Math.round(cv.height*k);
    c.getContext('2d').drawImage(cv,0,0,c.width,c.height);type='image/jpeg';q=FREE_Q;
  }
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='cleaned.'+(pro?'png':'jpg');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)},type,q);
  // exporting through a canvas also removes EXIF/GPS metadata
};
</script>
</body>
</html>
